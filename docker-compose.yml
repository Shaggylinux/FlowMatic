services:
  db:
    image: postgres:16
    container_name: flowmatic-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowmatic-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: flowmatic-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: America/Bogota
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/gestion
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-flowmatic31@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-xnawiqauwunwqwuj}
      MAIL_USERNAME: ${MAIL_USERNAME:-flowmatic31@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-xnawiqauwunwqwuj}
      MAIL_FROM: ${MAIL_FROM:-flowmatic31@gmail.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    volumes:
      - superfolder:/app/superfolder
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://flowmatic.tech/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  superfolder:

