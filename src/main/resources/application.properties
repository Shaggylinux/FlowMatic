spring.application.name=back

# Development defaults - override via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:flowmatic31@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xnawiqauwunwqwuj}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:flowmatic31@gmail.com}

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# File storage
file.storage.root=${FILE_STORAGE_ROOT:./superfolder}

# Security defaults (overridable via ConfiguracionService / DB)
login.max.attempts=${LOGIN_MAX_ATTEMPTS:5}
login.block.minutes=${LOGIN_BLOCK_MINUTES:15}
password.min.length=${PASSWORD_MIN_LENGTH:8}
password.reset.expiry.minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}

# App
app.base.url=${APP_BASE_URL:http://flowmatic.tech}
app.support.email=${APP_SUPPORT_EMAIL:}

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Disable Thymeleaf cache for development
spring.thymeleaf.cache=false