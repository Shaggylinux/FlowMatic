spring.application.name=back

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.mail.properties.mail.smtp.starttls.required=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.servlet.multipart.max-file-size=30MB

# File storage
file.storage.root=${FILE_STORAGE_ROOT:./superfolder}

# Security
login.max.attempts=${LOGIN_MAX_ATTEMPTS:5}
login.block.minutes=${LOGIN_BLOCK_MINUTES:15}
password.min.length=${PASSWORD_MIN_LENGTH:8}
password.reset.expiry.minutes=${PASSWORD_RESET_EXPIRY_MINUTES:15}

# App
app.base.url=${APP_BASE_URL}
app.support.email=${APP_SUPPORT_EMAIL}