<div th:fragment="rrhhContent">
    <header class="fm-topbar">
      <div>
        <p class="fm-topbar-title">Usuarios RRHH</p>
        <p class="fm-topbar-sub">Administración del personal de Recursos Humanos</p>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="gc-bell-btn" title="Notificaciones">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <button type="button" class="gc-topbar-btn" title="Exportar" th:onclick="|window.location.href='@{/admin/exportar}'|">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exportar
        </button>
        <button type="button" class="gc-topbar-btn gc-topbar-btn-primary" data-bs-toggle="modal" data-bs-target="#modalNuevoRRHH">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo RRHH
        </button>
      </div>
    </header>

    <div class="gc-page">
      <!-- 4 KPIs -->
      <div class="gc-stats-grid">
        <div class="gc-stat-card">
          <div class="gc-stat-inner">
            <div class="gc-stat-icon gc-stat-icon-brand">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="gc-stat-info">
              <p class="gc-stat-number" th:text="${totalRRHH}">0</p>
              <p class="gc-stat-label">Usuarios RRHH</p>
            </div>
          </div>
        </div>
        <div class="gc-stat-card">
          <div class="gc-stat-inner">
            <div class="gc-stat-icon gc-stat-icon-success">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            </div>
            <div class="gc-stat-info">
              <p class="gc-stat-number" th:text="${totalActivos}">0</p>
              <p class="gc-stat-label">Activos</p>
            </div>
          </div>
        </div>
        <div class="gc-stat-card">
          <div class="gc-stat-inner">
            <div class="gc-stat-icon gc-stat-icon-warning">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            </div>
            <div class="gc-stat-info">
              <p class="gc-stat-number" th:text="${totalPendientes}">0</p>
              <p class="gc-stat-label">Pendientes</p>
            </div>
          </div>
        </div>
        <div class="gc-stat-card">
          <div class="gc-stat-inner">
            <div class="gc-stat-icon" style="background: #FEF2F2; color: #EF4444;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <div class="gc-stat-info">
              <p class="gc-stat-number" th:text="${totalBloqueados}">0</p>
              <p class="gc-stat-label">Bloqueados</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="gc-filters">
        <form class="gc-filters-row" th:action="@{/admin}" method="get">
          <div class="gc-filter-search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--fm-text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" name="buscar" th:value="${buscar}" placeholder="Buscar por nombre, correo o documento..." class="gc-filter-input">
          </div>
          <select name="estado" class="gc-filter-select" onchange="this.form.submit()">
            <option value="">Todos los estados</option>
            <option value="Activo" th:selected="${estado == 'Activo'}">Activos</option>
            <option value="Pendiente" th:selected="${estado == 'Pendiente'}">Pendientes</option>
          </select>
          <button type="submit" class="gc-funnel-btn" title="Filtrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
          </button>
          <a th:href="@{/admin}" class="btn btn-ghost btn-sm">Limpiar</a>
        </form>
      </div>

      <!-- Main Grid (Tabla + Drawer) -->
      <div class="gc-main-grid">
        <div class="gc-table-area">
          <div class="gc-table-wrapper">
            <table class="gc-table">
              <thead>
                <tr>
                  <th style="width:44px;"></th>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Documento</th>
                  <th>Cargo</th>
                  <th>Estado</th>
                  <th>Último acceso</th>
                  <th style="width:80px;">Acciones</th>
                </tr>
              </thead>
              <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                  <td colspan="8">
                    <div class="gc-table-empty">
                      <p style="font-weight:500;">No hay usuarios RRHH registrados.</p>
                    </div>
                  </td>
                </tr>
                <tr th:each="u : ${usuarios}" class="gc-row-clickable" th:onclick="'abrirDrawerRRHH(' + ${u.id} + ')'">
                  <td>
                    <div class="gc-table-avatar">
                      <span th:text="${#strings.substring(u.nombre ?: u.email, 0, 1).toUpperCase()}"></span>
                    </div>
                  </td>
                  <td>
                    <div class="gc-user-info">
                      <p class="gc-user-name" th:text="${(u.nombre ?: '') + ' ' + (u.apellido ?: '')}"></p>
                    </div>
                  </td>
                  <td>
                    <p class="gc-text-truncate" style="max-width:180px;" th:text="${u.email}"></p>
                  </td>
                  <td>
                    <p th:text="${u.documento ?: '-'}"></p>
                  </td>
                  <td>
                    <p th:text="${u.cargo ?: 'Recursos Humanos'}"></p>
                  </td>
                  <td>
                    <span class="gc-badge" th:classappend="${u.activo} ? 'gc-badge-success' : 'gc-badge-warning'" th:text="${u.estado}"></span>
                  </td>
                  <td>
                    <p th:text="${u.ultimoAcceso != null ? #temporals.format(u.ultimoAcceso, 'dd MMM yyyy') : '-'}"></p>
                  </td>
                  <td>
                    <div class="gc-row-actions">
                      <button class="gc-btn-icon" title="Editar" th:onclick="'event.stopPropagation(); editarRRHH(' + ${u.id} + ')'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                      </button>
                      <button class="gc-btn-icon" title="Opciones" th:onclick="'event.stopPropagation(); openOptionsRRHH(' + ${u.id} + ')'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- Paginación simplificada -->
          <div class="gc-pagination" th:if="${totalPages > 1}">
            <div class="gc-page-info">
              <p>Mostrando <strong th:text="${startItem}"></strong> a <strong th:text="${endItem}"></strong> de <strong th:text="${totalItems}"></strong></p>
            </div>
            <div class="gc-page-controls">
              <a class="gc-page-btn" th:if="${currentPage > 0}" th:href="@{/admin(page=${currentPage - 1}, size=${pageSize}, buscar=${buscar}, estado=${estado})}">Anterior</a>
              <span class="gc-page-current" th:text="${currentPage + 1}"></span>
              <a class="gc-page-btn" th:if="${currentPage < totalPages - 1}" th:href="@{/admin(page=${currentPage + 1}, size=${pageSize}, buscar=${buscar}, estado=${estado})}">Siguiente</a>
            </div>
          </div>
        </div>

        <aside class="gc-drawer" id="drawerRRHH">
            <!-- Contenido dinámico del drawer aquí -->
        </aside>
      </div>

    </div>
</div>
