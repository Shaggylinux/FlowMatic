<div
    class="modal fade"
    id="modalReportes"
    tabindex="-1"
    aria-hidden="true"
    th:fragment="modalReportes">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <div>
                    <h4 class="modal-title">Reportes</h4>
                    <p class="modal-subtitle">Resumen de estad&iacute;sticas del sistema</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <div class="rp-grid">
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalUsuarios}">0</span>
                        <span class="rp-card-label">Total usuarios</span>
                    </div>
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalRRHH}">0</span>
                        <span class="rp-card-label">Usuarios RRHH</span>
                    </div>
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalActivos}">0</span>
                        <span class="rp-card-label">Activos</span>
                    </div>
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalPendientes}">0</span>
                        <span class="rp-card-label">Pendientes</span>
                    </div>
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalCandidatos}">0</span>
                        <span class="rp-card-label">Candidatos</span>
                    </div>
                    <div class="rp-card">
                        <span class="rp-card-value" th:text="${totalAdmins}">0</span>
                        <span class="rp-card-label">Administradores</span>
                    </div>
                </div>

                <div class="rp-divider"></div>

                <div class="rp-actions">
                    <a th:href="@{/admin/reportes/exportar}" class="rp-btn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exportar reporte a Excel
                    </a>
                    <div class="rp-btn rp-btn-disabled">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exportar actividad (pr&oacute;ximamente)
                    </div>
                </div>
            </div>

        </div>
    </div>

</div>
