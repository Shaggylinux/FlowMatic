<div
    class="modal fade"
    id="modalNuevoRRHH"
    tabindex="-1"
    aria-hidden="true"
    th:fragment="modalRRHH">

    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius: 16px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">

            <!-- Header -->
            <div class="modal-header">
                <div>
                    <h4 class="modal-title">Registrar Personal de RRHH</h4>
                    <p class="modal-subtitle">Completa los datos para registrar un nuevo usuario RRHH.</p>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/admin/crear-rrhh}" method="post">

                <div class="modal-body">
                    <div class="row g-3">

                        <!-- Nombre -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Nombre</label>
                            <input type="text" name="username" class="form-input" required
                                   minlength="2" maxlength="50"
                                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                                   oninput="this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '')"
                                   placeholder="Nombre">
                        </div>

                        <!-- Apellido -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Apellido</label>
                            <input type="text" name="apellido" class="form-input" required
                                   minlength="2" maxlength="50"
                                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+"
                                   oninput="this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '')"
                                   placeholder="Apellido">
                        </div>

                        <!-- Correo -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Correo electr&oacute;nico</label>
                            <input type="email" name="email" class="form-input" required
                                   maxlength="100" placeholder="correo@empresa.com">
                        </div>

                        <!-- Contraseña -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Contraseña</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="adminClaveRRHH" name="clave" class="form-input" required
                                       minlength="8" maxlength="100"
                                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}"
                                       title="Mínimo 8 caracteres con al menos una mayúscula, una minúscula, un número y un carácter especial"
                                       placeholder="Ej: Flowmatic#2026">
                                <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('adminClaveRRHH', this)" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar contraseña">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                        </div>

                        <!-- Confirmar Contraseña -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Confirmar contraseña</label>
                            <div class="password-input-wrapper">
                                <input type="password" id="adminConfirmarClaveRRHH" name="confirmarClave" class="form-input" required
                                       minlength="8" maxlength="100"
                                       placeholder="Repite la contraseña">
                                <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('adminConfirmarClaveRRHH', this)" aria-label="Mostrar u ocultar contraseña" title="Mostrar u ocultar contraseña">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                </button>
                            </div>
                            <span id="matchFeedbackAdminRRHH" class="password-match-feedback"></span>
                        </div>

                        <!-- Teléfono -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Teléfono</label>
                            <input type="tel" name="telefono" class="form-input" maxlength="10" minlength="10"
                                   pattern="[0-9]{10}" title="El teléfono debe contener 10 dígitos (número colombiano)"
                                   inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   placeholder="Ej: 3001234567">
                        </div>

                        <!-- Documento -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Documento</label>
                            <input type="text" name="documento" class="form-input" maxlength="10"
                                   pattern="[0-9]{1,10}" title="El documento debe contener solo números (máximo 10 dígitos)"
                                   inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                   placeholder="Número de documento (máx. 10)">
                        </div>

                        <!-- Cargo -->
                        <div class="col-md-6 form-group">
                            <label class="form-label" style="font-size: 12px; font-weight: 500; color: #64748B;">Cargo</label>
                            <input type="text" name="cargo" class="form-input" maxlength="100"
                                   pattern="[A-Za-záéíóúÁÉÍÓÚñÑ\s]+" title="El cargo debe contener solo letras"
                                   oninput="this.value = this.value.replace(/[^A-Za-záéíóúÁÉÍÓÚñÑ\s]/g, '')"
                                   placeholder="Cargo en la empresa">
                        </div>

                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Crear RRHH</button>
                </div>

            </form>

        </div>
    </div>

<script th:src="@{/js/password-toggle.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        initPasswordMatch('adminClaveRRHH', 'adminConfirmarClaveRRHH', 'matchFeedbackAdminRRHH');
    });
</script>
</div>
