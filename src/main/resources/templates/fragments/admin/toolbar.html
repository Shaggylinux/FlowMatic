<div class="admin-toolbar" th:fragment="toolbar">
  <!-- Lado izquierdo -->
  <div class="admin-toolbar-left">
    <form class="admin-search" th:action="@{/admin}" method="get">
      <input
        type="text"
        name="buscar"
        placeholder="Buscar por email..."
        class="admin-search-input"
        th:value="${buscar}"
      />
      <input type="hidden" name="page" value="0" />
      <input type="hidden" name="size" th:value="${pageSize ?: 10}" />
    </form>

    <select class="admin-filter" data-base="/admin" onchange="filtrarRol(this)">
      <option value="">Todos los roles</option>
      <option value="ROLE_ADMINISTRADOR" th:selected="${rol == 'ROLE_ADMINISTRADOR'}">Administrador</option>
      <option value="ROLE_RRHH" th:selected="${rol == 'ROLE_RRHH'}">RRHH</option>
    </select>
  </div>

  <!-- Lado derecho -->
  <div class="admin-toolbar-right">
    <span class="admin-toolbar-count">
      Mostrando
      <strong th:text="${startItem}"></strong>
      -
      <strong th:text="${endItem}"></strong>

      de

      <strong th:text="${totalItems}"></strong>

      usuarios
    </span>
  </div>
</div>
