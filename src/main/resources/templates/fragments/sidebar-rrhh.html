<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <body>
    <aside class="fm-sidebar" th:fragment="sidebarRRHH(activeMenu)">
      <div class="fm-sidebar-header">
        <a th:href="@{/}" class="fm-sidebar-logo" title="Ir al inicio" style="display: flex; align-items: center; gap: 10px; text-decoration: none;">
          <span th:replace="~{fragments/logo :: logoSidebar}"></span>
          <span style="color: #ffffff; font-size: 16px; font-weight: 800; letter-spacing: 0.04em;">Flowmatic</span>
        </a>
      </div>

      <nav style="padding-top: 8px">
        <span sec:authorize="hasRole('RRHH')" class="fm-sidebar-section-label">Panel RRHH</span>
        <span sec:authorize="hasRole('CANDIDATO')" class="fm-sidebar-section-label">Mi Proceso</span>
        
        <a sec:authorize="hasRole('CANDIDATO')" th:href="@{/candidato/home}" class="fm-nav-link" th:classappend="${activeMenu == 'inicio'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Inicio
        </a>

        <a sec:authorize="hasRole('CANDIDATO')" th:href="@{/candidato/perfil}" class="fm-nav-link" th:classappend="${activeMenu == 'perfil'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Mi perfil
        </a>
        
        <a sec:authorize="hasRole('RRHH')" th:href="@{/dashboard}" class="fm-nav-link" th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          Dashboard
        </a>

        <a sec:authorize="hasRole('RRHH')" th:href="@{/gestion-candidatos}" class="fm-nav-link" th:classappend="${activeMenu == 'candidatos'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Gestión de Candidatos
        </a>

        <a th:href="@{/calendario}" class="fm-nav-link" th:classappend="${activeMenu == 'calendario'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
          <span sec:authorize="hasRole('CANDIDATO')">Mis entrevistas</span>
          <span sec:authorize="hasRole('RRHH')">Calendario</span>
        </a>

        <a th:href="@{/drive}" class="fm-nav-link" th:classappend="${activeMenu == 'drive' or activeMenu == 'documentos'} ? ' active' : ''">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
          </svg>
          <span sec:authorize="hasRole('CANDIDATO')">Mis documentos</span>
          <span sec:authorize="hasRole('RRHH')">Drive</span>
        </a>
      </nav>

      <div class="fm-sidebar-footer">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="fm-user-card">
            <div class="fm-user-avatar" th:text="${usuarioActual != null ? usuarioActual.substring(0,2).toUpperCase() : 'US'}"></div>
            <div class="fm-user-info">
              <div class="fm-user-name" th:text="${usuarioActual}">Usuario</div>
              <div class="fm-user-role" th:text="${usuarioActualObjeto != null ? usuarioActualObjeto['rol'].replace('ROLE_', '') : 'Usuario'}"></div>
            </div>
            <svg class="fm-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </form>
      </div>

    </aside>
  </body>
</html>
