<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="modalRegistro(modalId, formId, closeBtnId)"
     th:id="${modalId}"
     class="modal-overlay" style="display:none;" sec:authorize="hasRole('RRHH')">
  <style>
    .mr-box {
      background: #ffffff;
      width: 100%;
      max-width: 640px;
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
      overflow: hidden;
      animation: gc-fade-in 0.15s ease;
      margin: auto;
    }
    .mr-header {
      padding: 22px 28px 16px;
      border-bottom: 1px solid #E2E8F0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mr-title { margin: 0; font-size: 18px; font-weight: 700; color: #0F172A; }
    .mr-subtitle { margin: 6px 0 0; color: #64748B; font-size: 14px; }
    .mr-body { padding: 24px 28px; }
    .mr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .mr-group {
      background: #FAFBFC;
      border: 1px solid #F1F5F9;
      border-radius: 10px;
      padding: 10px 14px;
      transition: all 0.15s ease;
    }
    .mr-group:focus-within {
      border-color: #0D9488;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.08);
    }
    .mr-label {
      display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 5px; letter-spacing: 0.01em;
    }
    .mr-input {
      width: 100%; padding: 7px 0; border: none; font-size: 13px; font-family: var(--fm-font); color: #0F172A; background: transparent; outline: none;
    }
    .mr-input::placeholder { color: #94A3B8; }
    .mr-footer {
      padding: 16px 28px 20px;
      border-top: 1px solid #E2E8F0;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
    .mr-btn-light {
      display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border: 1px solid #E2E8F0; border-radius: 10px; background: #ffffff; color: #475569; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s ease;
    }
    .mr-btn-light:hover { background: #F8FAFC; border-color: #CBD5E1; }
    .mr-btn-primary {
      display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #0D9488, #14B8A6); color: #ffffff; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s ease; gap: 8px;
    }
    .mr-btn-primary:hover { background: linear-gradient(135deg, #0F766E, #0D9488); box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25); transform: translateY(-1px); }
    @media (max-width: 600px) { .mr-grid { grid-template-columns: 1fr; } }
  </style>
  
  <div class="mr-box">
    <div class="mr-header">
      <div>
        <h4 class="mr-title">Nuevo candidato</h4>
        <p class="mr-subtitle">Completa los datos para registrar un nuevo candidato.</p>
      </div>
      <button th:id="${closeBtnId}" style="width: 32px; height: 32px; border: none; background: transparent; font-size: 24px; cursor: pointer; color: #94A3B8; display:flex; align-items:center; justify-content:center;"
              th:data-close-target="${modalId}"
              onclick="document.getElementById(this.dataset.closeTarget).style.display='none'"
              aria-label="Cerrar">&times;</button>
    </div>
    
    <form th:id="${formId}">
      <div class="mr-body">
        <div class="mr-grid">
          <div class="mr-group">
            <label class="mr-label">Nombre</label>
            <input type="text" name="username" class="mr-input" required placeholder="Nombre del candidato">
          </div>
          <div class="mr-group">
            <label class="mr-label">Apellido</label>
            <input type="text" name="apellido" class="mr-input" required placeholder="Apellido del candidato">
          </div>
          <div class="mr-group">
            <label class="mr-label">Correo electr&oacute;nico</label>
            <input type="email" name="email" class="mr-input" required placeholder="correo@ejemplo.com">
          </div>
          <div class="mr-group">
            <label class="mr-label">Contrase&ntilde;a</label>
            <input type="password" name="clave" class="mr-input" required minlength="8"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[^a-zA-Z0-9]).{8,}"
                   title="Mínimo 8 caracteres con al menos una mayúscula, una minúscula, un número y un carácter especial"
                   placeholder="Ej: Flowmatic#2026">
          </div>
          <input type="hidden" name="rol" value="ROLE_CANDIDATO">
        </div>
      </div>
      
      <div class="mr-footer">
        <button type="button" class="mr-btn-light"
                th:data-close-target="${modalId}"
                onclick="document.getElementById(this.dataset.closeTarget).style.display='none'">Cancelar</button>
        <button type="button" class="mr-btn-primary"
                th:attr="data-modal-id=${modalId}, data-form-id=${formId}"
                onclick="enviarRegistro(this.dataset.modalId, this.dataset.formId)">
          Registrar candidato
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  function enviarRegistro(modalId, formId) {
    var modal = document.getElementById(modalId);
    var form = document.getElementById(formId);
    if (!modal || !form) return;
    var datos = Object.fromEntries(new FormData(form).entries());
    fetch('/registro/candidato/api', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(datos)
    }).then(function(res) {
      if (res.ok) {
        modal.style.display = 'none';
        form.reset();
        alert('Candidato registrado. Se envi\u00f3 un correo de activaci\u00f3n.');
        location.reload();
      } else {
        return res.text().then(function(text) {
          alert(text && text.trim() ? text : 'Error al registrar candidato');
        });
      }
    }).catch(function() {
      alert('Error de conexión al registrar candidato');
    });
  }
</script>
</body>
</html>
