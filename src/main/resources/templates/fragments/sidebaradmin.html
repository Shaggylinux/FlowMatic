<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <aside class="fm-sidebar" th:fragment="sidebarAdmin">
      <div class="fm-sidebar-header">
        <a
          th:href="@{/admin/dashboard}"
          class="fm-sidebar-logo"
          title="Ir al inicio"
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
          "
        >
          <span th:replace="~{fragments/logo :: logoSidebar}"></span>
          <span
            style="
              color: #ffffff;
              font-size: 16px;
              font-weight: 800;
              letter-spacing: 0.04em;
            "
            >Flowmatic</span
          >
        </a>
      </div>

      <nav style="padding-top: 8px">
        <span class="fm-sidebar-section-label">Panel de control</span>
        <a
          th:href="@{/admin/dashboard}"
          class="fm-nav-link"
          th:classappend="${viewMode == 'dashboard'} ? ' active' : ''"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          Dashboard
        </a>
        <span class="fm-sidebar-section-label" style="padding-top:24px;">Administraci&oacute;n</span>
        <a
          th:href="@{/admin}"
          class="fm-nav-link"
          th:classappend="${viewMode == 'usuarios'} ? ' active' : ''"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
          </svg>
          Usuarios RRHH
        </a>
        <a
          href="#"
          class="fm-nav-link"
          data-bs-toggle="modal"
          data-bs-target="#modalConfiguracion"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Configuraci&oacute;n
        </a>
      </nav>

      <div class="fm-sidebar-footer">
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="fm-user-card">
          <div class="fm-user-avatar" th:text="${usuarioActual != null ? usuarioActual.substring(0,2).toUpperCase() : 'US'}"></div>
          <div class="fm-user-info">
            <div class="fm-user-name" th:text="${usuarioActual}">Usuario</div>
            <div class="fm-user-role" th:text="${usuarioActualObjeto != null ? usuarioActualObjeto['rol'].replace('ROLE_', '') : 'Usuario'}"></div>
          </div>
          <svg class="fm-user-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
        </form>
      </div>
    </aside>
  </body>
</html>
