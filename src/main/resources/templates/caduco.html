<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlace expirado — Flowmatic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body class="page-auth">

<div class="loader-overlay" id="loader">
  <div class="loader"></div>
</div>

<div class="split-container">

  <div class="split-form">
    <div class="split-form-box">

      <div style="display:flex; justify-content:center; margin-bottom:20px;">
        <a th:href="@{/}" title="Ir al inicio" class="logo-link">
          <span th:replace="~{fragments/logo :: logoFull}"></span>
        </a>
      </div>

      <h2 style="text-align:center; margin-bottom:8px;">Reenviar enlace de activación</h2>
      <p style="text-align:center; font-size:13px; color:var(--fm-text-muted); margin-bottom:24px;">
        Ingresa el correo con el que te registraste para recibir un nuevo enlace de activación.
      </p>

      <div th:if="${correoReenviado}" class="alert alert-success" style="margin-bottom:16px;">
        Revisa tu correo para activar tu cuenta.
      </div>
      <div th:if="${correoNoRegistrado}" class="alert alert-error" style="margin-bottom:16px;">
        Este correo no está registrado en el sistema
      </div>

      <form th:action="@{/registro/candidato/reenviar-activacion}" method="post" id="formReenviar">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="tucorreo@ejemplo.com"/>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Reenviar enlace de activación</button>
      </form>

      <div style="margin-top:16px; text-align:center;">
        <a class="fm-link" th:href="@{/login}">← Volver al inicio de sesión</a>
      </div>

    </div>
  </div>

  <div class="split-visual">
    <div class="split-visual-decor" style="top:-80px; right:-80px; width:160px; height:160px;"></div>
    <div class="split-visual-decor" style="bottom:-60px; left:-60px; width:120px; height:120px;"></div>
    <div class="split-visual-decor" style="top:33%; left:28%; width:80px; height:80px; border-width:1px;"></div>

    <div class="split-visual-content">
      <a th:href="@{/}" title="Ir al inicio" class="logo-link">
        <span th:replace="~{fragments/logo :: logoFull}"></span>
      </a>
      <p class="split-visual-tagline">Flowmatic — Gestión de Talento</p>
    </div>
  </div>

</div>

<script>
  document.getElementById("formReenviar").addEventListener("submit", () => {
    document.getElementById("loader").style.display = "flex";
  });
</script>
<script th:src="@{/js/csrf.js}"></script>
<script th:src="@{/js/i18n.js}"></script>
</body>
</html>
